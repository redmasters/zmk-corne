="middle" font-weight="bold">SPC</text><rect x="562" y="324" width="158" height="74" rx="12" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5"/><text x="641.0" y="316" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">39 + 40 = BSPC/DEL</text><rect x="48" y="390" width="1144" height="140" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="68" y="418" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" fill="#111827" text-anchor="start" font-weight="bold">Leitura rápida</text><text x="68" y="444" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">• A posição 41 do Corne não existe neste case. O &amp;bs_delete dela virou o combo 39+40.</text><text x="68" y="464" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">• Na layer NAV o mesmo combo é BSPC; na FUN é APP; na NUM é ponto; na DOTA é F8; na MOUSE é clique do meio.</text><text x="68" y="484" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">• 37 = GUI/NAV e 40 = SPACE, iguais ao Corne. A layer base é compartilhada com o Corne nas posições 0-35.</text><text x="68" y="504" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">• O combo tem timeout de 35 ms. Se disparar sem querer ao rolar ENTER+SPACE, reduza ou troque as posições no keymap.</text>
</svg>
