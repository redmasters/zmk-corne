 x="90" y="470" width="900" height="90" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="108" y="500" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" fill="#ea580c" text-anchor="start" font-weight="bold">Nunca ligue VCC no RAW.</text><text x="108" y="522" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">Use 3V3. O sensor é 3.3 V; RAW pode chegar a 4.2 V. A ball precisa ficar centrada e a lente na distância focal.</text><text x="108" y="544" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">Se o cursor andar invertido, descomente swap-xy/invert-x/invert-y em boards/shields/charybdis/charybdis_sensor.dtsi.</text>
