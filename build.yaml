# ZMK Corne - Configuração Padrão
# Documentação: https://zmk.dev/docs/user-setup
#
# Configuração padrão para Corne com nice!nano v2
# Compila firmware para ambas as metades do teclado

include:
# Dongle com display OLED
  - board: nice_nano_v2
    shield: corne_dongle
    snippet: common-config studio-rpc-usb-uart
    artifact-name: corne_dongle

# Left Half como Peripheral
  - board: nice_nano_v2
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    snippet: common-config studio-rpc-usb-uart
    artifact-name: corne_left

  # Right Half como Peripheral  
  - board: nice_nano_v2
    shield: corne_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    snippet: common-config studio-rpc-usb-uart
    artifact-name: corne_right

# Charybdis Mini 3x6 handwired (41 teclas + trackball PMW3610)
# O dongle é o MESMO nice!nano do Corne; grave charybdis_dongle nele quando
# for usar o Charybdis. O Studio USB fica só no central.
  - board: nice_nano_v2
    shield: charybdis_dongle
    snippet: common-config studio-rpc-usb-uart
    artifact-name: charybdis_dongle

  - board: nice_nano_v2
    shield: charybdis_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    snippet: common-config
    artifact-name: charybdis_left

  - board: nice_nano_v2
    shield: charybdis_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    snippet: common-config
    artifact-name: charybdis_right

 # Reset settings para todas as boards
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: 1settings_reset
