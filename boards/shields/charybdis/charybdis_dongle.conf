# Charybdis Mini 3x6 - dongle central
# Mesmo hardware do dongle do Corne; o OLED é o mesmo.

# Melhor alcance
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Perfis (n+2)
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Duas metades + combo 39+40 em várias layers
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=8
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_USE_CANVAS=y

# Scyan
CONFIG_SCYAN_ROTATION_0=y
CONFIG_SCYAN_IDLE_TIMEOUT_MS=30000
CONFIG_SCYAN_LEFT_IS_CENTRAL=y

# Widgets
CONFIG_ZMK_WPM=y
CONFIG_ZMK_HID_INDICATORS=y

# Estabilidade
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# Misc
CONFIG_LV_Z_VDB_SIZE=32

# Trackball vindo da metade direita
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
