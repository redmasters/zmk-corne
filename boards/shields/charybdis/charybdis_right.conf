# A metade direita é peripheral e hospeda o PMW3610.
CONFIG_ZMK_USB=n

# PMW3610 (https://github.com/badjeff/zmk-pmw3610-driver)
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_ZMK_POINTING=y

# Trackball em BLE: 12 ms é um bom equilíbrio entre resposta e estabilidade.
CONFIG_PMW3610_REPORT_INTERVAL_MIN=12

# Alguns breakouts do PMW3610DM-SUDU demoram mais que o padrão para responder.
# Se o log mostrar "Incorrect product id 0xFF", aumente para 1000.
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300

# A metade direita dorme mais cedo; a matriz é wakeup-source e o sensor usa
# force-awake enquanto o ZMK está ativo.
CONFIG_ZMK_IDLE_TIMEOUT=25000
