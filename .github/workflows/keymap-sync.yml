name: Check keymap sync

on:
  push:
    paths:
      - "config/*.keymap"
      - "scripts/check-keymap-sync.py"
      - ".github/workflows/keymap-sync.yml"
  pull_request:
    paths:
      - "config/*.keymap"
      - "scripts/check-keymap-sync.py"
      - ".github/workflows/keymap-sync.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare shared positions
        run: python3 scripts/check-keymap-sync.py
